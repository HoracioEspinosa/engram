name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"

      - name: Run unit tests
        run: go test ./...

  tui-coverage:
    name: TUI Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"

      - name: Enforce internal/tui coverage threshold
        run: bash scripts/tui-coverage-gate.sh

  golden-captures:
    name: Golden Captures
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The guard diffs the pull request's own range, so the base commit
          # has to be in the clone.
          fetch-depth: 0

      # A .golden file is ASCII with the colour stripped and the layout
      # flattened: nobody can tell from it whether the screen it froze is one a
      # person would want to look at. The capture in docs/tui/img/ is what
      # makes a regenerated golden reviewable.
      #
      # --warn while docs/tui/img/ does not exist: the guard has nothing to
      # point at, and a hard failure nobody can satisfy only teaches people to
      # ignore the job. Dropping the flag is what arms it.
      - name: Require a capture beside every regenerated golden
        run: bash scripts/dev/golden-guard.sh --warn "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"

      - name: Run e2e tests
        run: go test -tags e2e ./internal/server/...
