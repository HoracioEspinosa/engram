name: release-custom

# Release pipeline for the ClaroDrive fork. It owns every artifact the rollout
# consumes: the platform binaries and the Homebrew formula on the fork's tap,
# and the container image the cloud runtime runs.
#
# It fires on tags shaped v<upstream-version>-cd.<n> (v1.20.0-cd.1), never on a
# plain v* tag: those belong to upstream's release.yml and cloud-image.yml,
# which are fenced off to the upstream repository so a tag pushed here cannot
# reach the upstream tap or the upstream image namespace.
on:
  push:
    tags:
      - "v*-cd.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v1.20.0-cd.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  # ghcr rejects an uppercase path, and this fork's owner has capitals, so the
  # namespace is written out instead of derived from github.repository_owner.
  IMAGE: ghcr.io/horacioespinosa/engram
  GO_VERSION: "1.25.10"

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    if: github.repository == 'HoracioEspinosa/engram'
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and check the tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v*-cd.*) ;;
            *) echo "::error::tag '$tag' is not shaped v<version>-cd.<n>"; exit 1 ;;
          esac

          # A release must come off main. Reading the branch list into a
          # variable first keeps the failure of git itself distinguishable from
          # "the commit is not on that branch".
          sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          branches="$(git branch -r --contains "$sha")"
          if ! printf '%s\n' "$branches" \
               | awk '/^[[:space:]]*origin\/main$/{found=1} END{exit !found}'; then
            echo "::error::tag '$tag' points at $sha, which is not on origin/main"
            printf 'branches containing it:\n%s\n' "$branches"
            exit 1
          fi

          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "${tag#v}"
            printf 'sha=%s\n' "$sha"
          } >> "$GITHUB_OUTPUT"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # ci.yml covers the branch, but a tag points at one specific commit and
      # this runs against that tree. It is the gate that stops an unbuildable
      # commit from becoming a release the team installs, whatever the last
      # branch run happened to say.
      - name: Run unit tests
        run: go test ./...

  binaries:
    name: Binaries and Homebrew formula
    runs-on: ubuntu-latest
    needs: [guard, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2.12"
          install-only: true

      # `goreleaser check` exits 2, not 1, when the config is valid but uses a
      # deprecated property (our `brews` formula, kept on purpose — see the
      # comment in .goreleaser.custom.yaml). goreleaser-action's own `args:`
      # form treats any nonzero exit as a failure, so this step calls the
      # installed binary directly and decides: exit 2 is a pass with a note,
      # exit 1 or anything else stays fatal. Loosening this to "tolerate any
      # failure" would defeat the gate for a genuinely invalid configuration,
      # which is the one thing it exists to catch.
      - name: Validate the release configuration
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ""
        run: |
          set +e
          goreleaser check -f .goreleaser.custom.yaml
          status=$?
          set -e
          case "$status" in
            0) ;;
            2) echo "::notice::goreleaser check: valid configuration, deprecated properties tolerated (brews formula)" ;;
            *) echo "::error::goreleaser check failed with exit $status"; exit "$status" ;;
          esac

      # The tap is a separate repository with its own token. Until it exists,
      # the release still has to produce binaries: without this branch the
      # whole run would fail on a missing secret and ship nothing.
      - name: Decide whether the formula can be published
        id: formula
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${HOMEBREW_TAP_TOKEN}" ]; then
            printf 'skip_args=\n' >> "$GITHUB_OUTPUT"
            printf 'note=formula published to HoracioEspinosa/homebrew-tap\n' >> "$GITHUB_OUTPUT"
          else
            printf 'skip_args=--skip=homebrew\n' >> "$GITHUB_OUTPUT"
            printf 'note=HOMEBREW_TAP_TOKEN is unset, formula NOT published\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2.12"
          args: release --clean -f .goreleaser.custom.yaml ${{ steps.formula.outputs.skip_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.guard.outputs.tag }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Report
        shell: bash
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          NOTE: ${{ steps.formula.outputs.note }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # the backticks are markdown, not command substitution
          {
            printf '## Binaries\n\n'
            printf -- '- release: `%s`\n' "$TAG"
            printf -- '- %s\n' "$NOTE"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [guard, tests]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :custom is the moving tag the cloud deployment follows; the version and
      # sha- tags are the immutable ones a rollback names.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/custom/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            ENGRAM_VERSION=${{ needs.guard.outputs.version }}
            ENGRAM_REVISION=${{ needs.guard.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:custom
            ${{ env.IMAGE }}:${{ needs.guard.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ needs.guard.outputs.sha }}

      # Publishing an image nobody ran is how a "release" becomes an outage.
      # This pulls back what was actually pushed, by digest, and makes the
      # stamped version prove itself.
      - name: Verify the published image
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          # The update notice goes to stderr; taking the line that starts with
          # "engram " keeps this gate about the version itself.
          got="$(docker run --rm "${IMAGE}@${DIGEST}" --version | awk '/^engram /{print; exit}')"
          printf 'image reports: %s\n' "$got"
          [ "$got" = "engram ${EXPECTED}" ] || {
            echo "::error::image reports '$got', expected 'engram ${EXPECTED}'"
            exit 1
          }

      - name: Report
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # the backticks are markdown, not command substitution
          {
            printf '## Container image\n\n'
            printf -- '- moving tag: `%s:custom`\n' "$IMAGE"
            printf -- '- immutable: `%s:%s`\n' "$IMAGE" "$VERSION"
            printf -- '- digest: `%s`\n\n' "$DIGEST"
            printf 'Deploy by digest so a rollback has something exact to name:\n\n'
            printf '```\n%s@%s\n```\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
