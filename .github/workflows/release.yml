name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # This job publishes to Gentleman-Programming/homebrew-tap. A fork that
    # pushes a v* tag would run it too and attempt a write into a repository it
    # does not own, so it is fenced to the upstream repository. The ClaroDrive
    # fork releases from release-custom.yml on v*-cd.* tags instead.
    if: github.repository == 'Gentleman-Programming/engram'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
