# GoReleaser configuration for the ClaroDrive fork release (branch main).
#
# It is a SEPARATE file from .goreleaser.yaml on purpose. The upstream config
# publishes to Gentleman-Programming/homebrew-tap; running it from this fork
# would attempt a write into a repository this team does not own. Every target
# below is pinned to the fork, so a misfire cannot reach upstream.
#
# Invoked by .github/workflows/release-custom.yml on tags matching v*-cd.*
# (for example v1.20.0-cd.1: upstream base version, custom revision).
#
# Local dry run (never inside the working checkout, it writes dist/):
#   scripts/release/build-release.sh
# (or with --tag v1.20.0-cd.1 to test a specific version)
version: 2

project_name: engram

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/engram
    binary: engram
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # main.version is the single source of `engram --version`. Without this
    # ldflag the binary reports "dev" and the release is indistinguishable from
    # a local build, which is exactly what the rollout has to be able to tell
    # apart.
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        - cmd: sh -c 'if [ "{{ .Os }}" = "darwin" ] && command -v codesign >/dev/null 2>&1; then codesign --force --sign - "{{ .Path }}"; fi'

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Pinning owner and name is the guard that matters: with them, an accidental
# run from a checkout whose origin points elsewhere still publishes here.
release:
  github:
    owner: HoracioEspinosa
    name: engram
  prerelease: auto
  name_template: "engram {{ .Version }} (ClaroDrive fork)"
  header: |
    Fork release of engram for the ClaroDrive platform, built from `main`.

    Container image for the cloud runtime:
    `ghcr.io/horacioespinosa/engram:{{ .Version }}`

# A formula, not a cask: Homebrew only serves casks on macOS, and this team
# needs `brew install` on Linux too. `brews` is the artifact type GoReleaser
# deprecated in favor of `homebrew_casks` for precompiled binaries (see the
# GoReleaser v2.16 release notes), but deprecated is not the same as removed:
# `goreleaser check` reports it with exit code 2 ("uses deprecated
# properties"), not exit 1 ("invalid configuration"), and the generator still
# writes a correct formula, covering macOS and Linux, amd64 and arm64, from
# the same archives every other artifact here is built from. The one thing
# this requires is that release-custom.yml's check step tolerate exit 2
# without tolerating exit 1 or any other nonzero code — see the comment there.
#
# A formula install via `curl` never gets the com.apple.quarantine attribute
# Gatekeeper checks for in the first place (that attribute is a Cask-specific
# safety feature Homebrew added on top of its own downloads — see
# Homebrew/homebrew-cask#22388), so this needs no post-install dequarantine
# hook the way the cask did.
brews:
  # Named engram-custom, not engram, so `brew upgrade engram` can never swap a
  # team machine back onto the upstream build behind its owner's back. The
  # binary it installs is still called engram.
  - name: engram-custom
    repository:
      owner: HoracioEspinosa
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/HoracioEspinosa/engram"
    description: "Engram (ClaroDrive fork): persistent memory for AI coding agents, with engram-projects"
    license: "MIT"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "chore: update engram-custom formula to {{ .Tag }}"
    install: |
      bin.install "engram"
    test: |
      assert_match version.to_s, shell_output("#{bin}/engram --version")
    # A machine that already has the upstream formula owns
    # $(brew --prefix)/bin/engram, and this install refuses to overwrite it.
    caveats: |
      This build replaces the upstream engram binary. If Homebrew refuses to
      link it, uninstall the upstream formula first:

        brew uninstall engram

      After installing, confirm the version and the schema:

        engram --version
        engram doctor
